filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata: ~
      - drop_event:
          when:
            not:
              equals:
                container.name: "go-app"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
